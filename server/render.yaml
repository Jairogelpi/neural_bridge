services:
  - type: web
    name: neural-bridge-api
    runtime: docker
    plan: starter
    autoDeploy: true
    envVars:
      - key: ENV
        value: prod
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: JWT_TTL
        value: 24h
      - key: DEFAULT_MAX_CALLS
        value: "2"
      - key: DEFAULT_TOKEN_BUDGET
        value: "2000"
      - key: DEFAULT_MAX_TOKENS_PER_CALL
        value: "1200"
      - key: DEFAULT_STORE_TRANSCRIPT
        value: "false"
      - key: DEFAULT_TRANSCRIPT_TTL_HOURS
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
