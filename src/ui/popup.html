<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Bridge</title>
  <link rel="stylesheet" href="./crystal_theme.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">
</head>

<body>

  <div class="header">
    <div id="auth-status" class="status-badge">NOT SIGNED IN</div>
    <div class="brand">
      <span>NEURAL BRIDGE</span>
      <div class="usb-icon"></div>
    </div>
  </div>

  <!-- AUTH VIEW -->
  <div id="view-auth" class="view" style="display: none;">
    <div class="auth-card">
      <div id="auth-login">
        <h2 class="auth-title">IDENTIFY</h2>
        <div class="input-stack">
          <input type="email" id="login-email" placeholder="Email Address" class="cyber-input" />
          <input type="password" id="login-password" placeholder="Access Key" class="cyber-input" />
        </div>
        <button class="cyber-btn primary" id="btn-login-submit">SIGN IN</button>
        <p class="auth-switch">New here? <a href="#" id="link-show-register">Create Identity</a></p>
      </div>

      <div id="auth-register" style="display: none;">
        <h2 class="auth-title">CREATE</h2>
        <div class="input-stack">
          <input type="text" id="reg-name" placeholder="Full Name" class="cyber-input" />
          <input type="text" id="reg-handle" placeholder="Handle" class="cyber-input" />
          <input type="email" id="reg-email" placeholder="Email" class="cyber-input" />
          <input type="password" id="reg-password" placeholder="Password" class="cyber-input" />
        </div>
        <button class="cyber-btn primary" id="btn-register-submit">INITIALIZE</button>
        <p class="auth-switch">Already linked? <a href="#" id="link-show-login">Login</a></p>
      </div>

      <div id="auth-error" class="error-msg"></div>
    </div>
  </div>

  <div id="main-content" class="view">
    <div class="tabs">
      <div class="tab active" id="tab-live">Reality Matrix</div>
      <div class="tab" id="tab-storage">Knowledge Storage</div>
    </div>

    <!-- LIVE MODE -->
    <div id="view-live">
      <div class="crystal-heart" id="sensor-container">
        <div class="shard-nexus">
          <div class="shard" id="reality-shard"></div>
        </div>

        <div class="integrity-card">
          <div class="integrity-label">ONTOLOGICAL PURITY</div>
          <div class="integrity-value" id="uSID-status">ESTABLISHING...</div>
        </div>
      </div>

      <div class="metrics-container">
        <div class="metric-block">
          <div class="metric-header">
            <span>SEMANTIC FIDELITY</span>
            <span id="val-fidelity" class="val">--%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="bar-fidelity"></div>
          </div>
        </div>

        <div class="metric-footer">
          <div class="pill">
            <span class="pill-label">LATENCY:</span>
            <span id="val-latency" class="pill-val">0.4ms</span>
          </div>
          <div class="pill">
            <span class="pill-label">NODES:</span>
            <span id="val-nodes" class="pill-val">12</span>
          </div>
        </div>
      </div>
    </div>

    <!-- STORAGE MODE -->
    <div id="view-storage" style="display: none;">
      <div class="storage-area">
        <textarea id="crystal-input" class="crystal-texarea"
          placeholder="Inject Knowledge Crystal (JSON)..."></textarea>

        <div class="action-row">
          <button class="action-btn" id="btn-inject">INJECT</button>
          <button class="action-btn secondary" id="btn-copy">COPY ACTIVE</button>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-nexus">
    <div id="user-info" class="user-handle"></div>
    <button id="open-dashboard" class="dashboard-launch-btn">
      VIEW FULL DASHBOARD
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7" />
      </svg>
    </button>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>

</html>
