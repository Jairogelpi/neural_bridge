<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SENTINEL | Neural Bridge Omega</title>
    <link rel="stylesheet" href="/sentinel/sentinel_dashboard.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body class="sentinel-mode">
    <div class="sentinel-container">
        <!-- HEADER -->
        <header class="sentinel-header">
            <div class="sentinel-brand">SENTINEL ENGINE v4.0</div>
            <div class="system-status">
                <span style="color: #666">Purity:</span> <span id="purity-value"
                    style="color: var(--sentinel-cyan)">100.00%</span>
                <span style="margin-left: 20px; color: #666">Status:</span> <span
                    style="color: var(--sentinel-cyan)">OMEGA ACTIVE</span>
            </div>
        </header>

        <!-- LEFT PANEL: TELEMETRY -->
        <aside class="panel left-panel">
            <div class="panel-header">System Metrics</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-vaccines">--</div>
                    <div class="stat-label">VACCINES</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-crystals">--</div>
                    <div class="stat-label">CRYSTALS</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-latency">--ms</div>
                    <div class="stat-label">AVG LATENCY</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-entropy">0.0</div>
                    <div class="stat-label">LATTICE ENTROPY</div>
                </div>
                <div class="stat-card" style="grid-column: span 2">
                    <div class="stat-value" id="stat-evolutions">0</div>
                    <div class="stat-label">ACTIVE EVOLUTIONS</div>
                </div>
                <div class="stat-card" style="grid-column: span 2; border: 1px solid var(--sentinel-cyan)">
                    <div class="stat-label" style="font-size: 8px; color: var(--sentinel-cyan)">CONSENSUS PULSE</div>
                    <div class="stat-value" id="stat-consensus" style="font-size: 24px">--%</div>
                    <div style="width: 100%; height: 2px; background: rgba(0, 242, 255, 0.1); margin-top: 5px;">
                        <div id="consensus-bar"
                            style="width: 0%; height: 100%; background: var(--sentinel-cyan); box-shadow: 0 0 10px var(--sentinel-cyan); transition: width 0.5s ease">
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel-header" style="border-top: 1px solid var(--sentinel-border)">Active Guards</div>
            <div class="event-log" id="guards-list">
                <!-- Dynamic guards list -->
            </div>
        </aside>

        <!-- CENTER: THE LATTICE -->
        <main class="lattice-stage">
            <div class="lattice-core">
                <!-- Visual representation of the knowledge graph -->
                <svg width="300" height="300" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="var(--sentinel-cyan)" stroke-width="0.5"
                        stroke-dasharray="2 2" />
                    <circle cx="50" cy="50" r="30" fill="none" stroke="var(--sentinel-cyan)" stroke-width="1" />
                    <circle cx="50" cy="50" r="2" fill="var(--sentinel-cyan)" />
                </svg>
                <div class="singularity-level">Ω</div>
            </div>
            <div class="resonance-stage">
                <div class="resonance-pulse" style="animation-delay: 0s"></div>
                <div class="resonance-pulse" style="animation-delay: 1s"></div>
                <div class="resonance-pulse" style="animation-delay: 2s"></div>
            </div>
            <div
                style="position: absolute; bottom: 40px; font-family: 'JetBrains Mono'; font-size: 10px; color: var(--sentinel-cyan)">
                GLOBAL KNOWLEDGE LATTICE: ENTANGLED
            </div>
        </main>

        <!-- RIGHT PANEL: LOGS -->
        <aside class="panel right-panel">
            <div class="panel-header">Sentinel Event Log</div>
            <div class="event-log" id="sentinel-events">
                <!-- Real-time events from the backend -->
                <div class="event-item info">
                    <div class="event-time">10:04:22</div>
                    <div class="event-msg">System Boot: Omega Core Synchronized.</div>
                </div>
            </div>
        </aside>
    </div>

    <script type="module">
        // THE SENTINEL REAL-TIME ENGINE
        const API_BASE = window.location.origin;

        async function refreshStats() {
            try {
                const res = await fetch(`${API_BASE}/v1/sentinel/stats`);
                const { stats } = await res.json();

                document.getElementById('stat-vaccines').textContent = stats.total_vaccines;
                document.getElementById('stat-crystals').textContent = stats.total_crystals;

                // Use stats health/consensus if available
                const avgConsensus = (stats.system_health || 1.0) * 100;
                const avgEntropy = 1.0 - (stats.system_health || 1.0);
                const avgLatency = 412; // Base latency simulation if no real logs yet

                document.getElementById('stat-latency').textContent = avgLatency + "ms";
                document.getElementById('stat-entropy').textContent = avgEntropy.toFixed(3);
                document.getElementById('stat-evolutions').textContent = stats.total_jury_cases || 0;
                document.getElementById('stat-consensus').textContent = avgConsensus.toFixed(1) + "%";
                document.getElementById('consensus-bar').style.width = avgConsensus + "%";
                document.getElementById('purity-value').textContent = avgConsensus.toFixed(2) + "%";

                // Update Resonance Pulse based on Consensus/Stability
                const pulses = document.querySelectorAll('.resonance-pulse');
                const pulseOpacity = (avgConsensus / 100) * 0.5;
                pulses.forEach(p => p.style.borderColor = `rgba(0, 242, 255, ${pulseOpacity})`);
            } catch (e) { console.error('Stats Refresh Error:', e); }
        }

        async function refreshLogs() {
            try {
                const res = await fetch(`${API_BASE}/v1/sentinel/logs`);
                const { logs } = await res.json();
                const container = document.getElementById('sentinel-events');

                if (!logs || logs.length === 0) {
                    container.innerHTML = '<div class="event-item info"><div class="event-msg">Waiting for real-time events...</div></div>';
                    return;
                }

                container.innerHTML = logs.map(log => `
                    <div class="event-item ${log.severity || 'info'}">
                        <div class="event-time">${new Date(log.timestamp).toLocaleTimeString()}</div>
                        <div class="event-msg">[${log.type}] ${log.message}</div>
                    </div>
                `).join('');
            } catch (e) { console.error('Logs Refresh Error:', e); }
        }

        // Initialize
        refreshStats();
        refreshLogs();
        setInterval(refreshStats, 5000);
        setInterval(refreshLogs, 2000);
    </script>
</body>

</html>
