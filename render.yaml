services:
  - type: web
    name: neural-bridge-backend
    runtime: docker
    envVars:
      - key: PORT
        value: 3000
      - key: ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_MODEL
        value: google/gemini-2.0-flash-001
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SIGNING_KEY
        sync: false
    healthCheckPath: /health
