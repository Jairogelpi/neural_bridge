services:
  - type: web
    name: neural-bridge-backend
    runtime: docker
    envVars:
      - key: ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_MODEL
        value: google/gemini-2.0-flash-001
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SIGNING_KEY
        sync: false
    healthCheckPath: /health

  - type: web
    name: neural-bridge-dashboard
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    rootDirectory: dashboard
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://neural-bridge-backend.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: open-webui
    runtime: docker
    plan: starter
    envVars:
      - key: OPENAI_API_BASE_URL
        value: https://neural-bridge-backend.onrender.com/v1
      - key: OPENAI_API_KEY
        value: neural-bridge-sovereign-internal
      - key: WEBUI_AUTH
        value: "true"
      - key: WEBUI_NAME
        value: "Neural Bridge Hive"
    disk:
      name: openwebui-data
      mountPath: /app/backend/data
      sizeGB: 10
