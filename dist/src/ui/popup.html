<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Bridge</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <script type="module" crossorigin src="/assets/popup.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/popup-Cw8cm5Nd.css">
</head>

<body>

  <div class="header">
    <div class="brand">
      <div class="usb-icon"></div>
      NEURAL BRIDGE
    </div>
    <div style="font-size: 10px; color: var(--crystal-cyan);">CONNECTED</div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-live">Live Link</div>
    <div class="tab" id="tab-storage">Crystal Storage</div>
  </div>

  <!-- LIVE MODE: REALITY MATRIX (v2.0) -->
  <div id="view-live">

    <!-- REALITY SENSOR (The Core Innovation) -->
    <div class="crystal-viewer reality-sensor" id="sensor-container">
      <div class="shard" id="reality-shard"></div>

      <div class="sensor-readout">
        <div class="readout-label">ONTOLOGY STATUS</div>
        <div class="readout-value valid" id="uSID-status">VALID REALITY</div>
      </div>

      <div class="sensor-details">
        <div class="detail-row">
          <span>DOMAIN:</span>
          <span id="domain-scan" class="highlight">SCANNING...</span>
        </div>
        <div class="detail-row">
          <span>INVARIANTS:</span>
          <span id="invariant-count">--</span>
        </div>
      </div>
    </div>

    <!-- METRICS GRID -->
    <div class="metrics-panel">
      <div class="metric-row">
        <span>SEMANTIC FIDELITY (SRI)</span>
        <span id="val-fidelity">--%</span>
      </div>
      <div class="metric-bar">
        <div class="metric-fill" id="bar-fidelity"></div>
      </div>

      <div style="margin-top: 12px;" class="metric-row">
        <span>TOKEN EFFICIENCY</span>
        <span id="val-tokens">--</span>
      </div>
    </div>
  </div>

  <!-- STORAGE MODE (Paste/Copy) -->
  <div id="view-storage" style="display: none; padding: 16px;">
    <div style="font-size: 10px; margin-bottom: 8px; color: var(--text-muted);">INJECT CRYSTAL (JSON)</div>
    <textarea id="crystal-input" placeholder="Paste Crystal JSON here..."></textarea>

    <div class="action-grid">
      <button class="cyber-btn" id="btn-inject">
        <i>⚡</i>
        Inject
      </button>
      <button class="cyber-btn" id="btn-copy">
        <i>📋</i>
        Copy Active
      </button>
    </div>
  </div>

  <div style="padding: 10px; text-align: center;">
    <a href="#" id="open-dashboard" style="font-size: 10px; color: var(--text-muted); text-decoration: none;">OPEN FULL
      DASHBOARD -></a>
  </div>

</body>

</html>
