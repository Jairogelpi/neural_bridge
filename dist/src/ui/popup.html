<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Bridge</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/popup.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/client-BYTJAMrK.js">
  <link rel="stylesheet" crossorigin href="/assets/popup-DAAP_9_e.css">
</head>

<body>

  <!-- HEADER -->
  <header class="nb-header">
    <div class="nb-logo">
      <svg class="nb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2" />
        <line x1="12" y1="22" x2="12" y2="15.5" />
        <polyline points="22 8.5 12 15.5 2 8.5" />
      </svg>
      <span>Neural Bridge</span>
    </div>
    <div id="status-pill" class="nb-status">Idle</div>
  </header>

  <!-- AUTH VIEW -->
  <div id="view-auth" class="nb-view" style="display: none;">
    <div class="nb-auth-card">
      <div id="auth-login">
        <h2 class="nb-auth-title">Sign In</h2>
        <div class="nb-input-group">
          <input type="email" id="login-email" placeholder="Email" class="nb-input" />
          <input type="password" id="login-password" placeholder="Password" class="nb-input" />
        </div>
        <button class="nb-btn nb-btn-primary" id="btn-login-submit">Continue</button>
        <p class="nb-auth-switch">Don't have an account? <a href="#" id="link-show-register">Register</a></p>
      </div>

      <div id="auth-register" style="display: none;">
        <h2 class="nb-auth-title">Create Account</h2>
        <div class="nb-input-group">
          <input type="text" id="reg-name" placeholder="Full Name" class="nb-input" />
          <input type="text" id="reg-handle" placeholder="Handle" class="nb-input" />
          <input type="email" id="reg-email" placeholder="Email" class="nb-input" />
          <input type="password" id="reg-password" placeholder="Password" class="nb-input" />
        </div>
        <button class="nb-btn nb-btn-primary" id="btn-register-submit">Create</button>
        <p class="nb-auth-switch">Already have an account? <a href="#" id="link-show-login">Sign In</a></p>
      </div>

      <div id="auth-error" class="nb-error"></div>
    </div>
  </div>

  <!-- MAIN VIEW -->
  <main id="main-content" class="nb-view">

    <!-- HERO: Crystallize Action -->
    <section class="nb-hero">
      <button id="btn-crystallize" class="nb-crystallize-btn">
        <svg class="nb-crystallize-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2" />
          <line x1="12" y1="22" x2="12" y2="15.5" />
          <polyline points="22 8.5 12 15.5 2 8.5" />
          <line x1="2" y1="8.5" x2="12" y2="2" />
        </svg>
        <span>Crystallize Page</span>
      </button>
      <p class="nb-hero-hint">Capture verified knowledge from this page</p>
    </section>

    <!-- PHASE CHI: UNIVERSAL PLUG -->
    <section class="nb-universal-plug">
      <div class="nb-plug-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
        </svg>
        <span>Universal Plug</span>
      </div>
      <div class="nb-plug-body">
        <input type="text" id="plug-url" placeholder="Paste URL or drag PDF here..." class="nb-input-small" />
        <button id="btn-plug-submit" class="nb-btn-small">Link Brain</button>
      </div>
    </section>

    <!-- STATUS CARD -->
    <section class="nb-status-card">
      <div class="nb-status-row">
        <span class="nb-status-label">Domain</span>
        <span id="val-domain" class="nb-status-value">Detecting...</span>
      </div>
      <div class="nb-status-row">
        <span class="nb-status-label">Semantic Fidelity</span>
        <span id="val-fidelity" class="nb-status-value">--%</span>
      </div>
      <div class="nb-status-row">
        <span class="nb-status-label">Integrity</span>
        <span id="val-integrity" class="nb-status-value nb-value-accent">Scanning...</span>
      </div>
    </section>

    <!-- CRYSTAL PREVIEW (hidden by default) -->
    <section id="crystal-preview" class="nb-crystal-preview" style="display: none;">
      <div class="nb-preview-header">
        <span>Crystal Ready</span>
        <button id="btn-copy-crystal" class="nb-btn-icon" title="Copy to Clipboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      </div>
      <div id="crystal-data" class="nb-crystal-data"></div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="nb-footer">
    <div id="user-info" class="nb-user-info"></div>
    <button id="open-dashboard" class="nb-footer-btn">
      <span>Open Dashboard</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
    </button>
  </footer>

</body>

</html>
